# Safety Rules and Content Guardrails

banned_topics:
  - "adult content"
  - "pornography"
  - "hate speech"
  - "racism"
  - "extremism"
  - "terrorism"
  - "violence"
  - "child abuse"
  - "jailbreak"
  - "malware tutorial"
  - "hacking tutorial"
  - "doxxing"

banned_phrases_in_script:
  - "guaranteed profit"
  - "guaranteed returns"
  - "100% safe investment"
  - "get rich quick"
  - "this is not financial advice but you should definitely"
  - "cure for cancer"
  - "cure diabetes"
  - "doctors don't want you to know"
  - "big pharma hiding"
  - "they don't want you to see this"

copyright_risk_terms:
  - "full episode"
  - "full movie"
  - "leaked footage"
  - "copyrighted music"
  - "official soundtrack"
  - "I downloaded"
  - "ripped from"

financial_claim_patterns:
  - "guaranteed"
  - "risk-free"
  - "100% profit"
  - "never lose"
  - "you will make"
  - "you will earn"

preferred_topics:
  - "AI tools"
  - "AI agents"
  - "Bittensor"
  - "GPU infrastructure"
  - "crypto compute"
  - "tech explainers"
  - "rural AI business"
  - "government surplus server deals"
  - "automation workflows"
  - "open-source AI"
  - "local LLM"
  - "machine learning"
  - "data center"
  - "GPU deals"
  - "AI model releases"

rejected_topics:
  - "celebrity gossip"
  - "celebrity drama"
  - "reality TV"
  - "sports betting tips"
  - "forex signals"
  - "crypto pump"
  - "meme coins"
  - "political controversy"
  - "medical diagnosis"

quality_thresholds:
  min_script_words: 600
  max_script_words: 2000
  min_quality_score: 75
  min_duration_seconds: 240
  max_duration_seconds: 600
  max_duplicate_paragraph_ratio: 0.25
